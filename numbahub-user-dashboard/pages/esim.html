<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eSIM — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  
<div id="sidebar"></div>

  <div class="overlay"></div>
  <div class="main">
    

    <main class="container">
      
<div class="page-heading">
  <h2>eSIM</h2>
  <p>Browse and manage digital SIM plans.</p>
</div>
<div class="grid-3">
<div class="product-card">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h3>Nigeria</h3>
    <span class="count">eSIM</span>
  </div>
  <div class="product-price">1 GB</div>
  <div class="muted">7 days</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;">
    <strong>$2.50</strong>
    <button class="blue-button" data-action="buy">Buy plan</button>
  </div>
</div>
<div class="product-card">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h3>United States</h3><span class="count">eSIM</span>
  </div>
  <div class="product-price">5 GB</div>
  <div class="muted">15 days</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;">
    <strong>$8.00</strong>
    <button class="blue-button" data-action="buy">Buy plan</button>
  </div>
</div>
<div class="product-card">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h3>United Kingdom</h3>
    <span class="count">eSIM</span>
  </div>
  <div class="product-price">10 GB</div>
  <div class="muted">30 days</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;">
    <strong>$15.00</strong>
    <button class="blue-button" data-action="buy">Buy plan</button>
  </div>
</div>
</div>

    </main>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
