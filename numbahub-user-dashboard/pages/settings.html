<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .settings-container { display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: start; }
    .settings-menu { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 12px; }
    .settings-menu-btn { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 10px; border: none; background: transparent; color: #64748b; font-size: 14px; font-weight: 500; cursor: pointer; }
    .settings-menu-btn.active { background: #eff6ff; color: var(--brand); }
    .settings-content { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 40px; }
    .settings-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .settings-form-grid .full { grid-column: 1 / -1; }
    .avatar-large { width: 80px; height: 80px; border-radius: 50%; background: #eff6ff; color: var(--brand); display: grid; place-items: center; font-size: 28px; font-weight: 700; }
    .section-title { font-size: 16px; font-weight: 700; margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); color: var(--text); }
    .toast { position: fixed; top: 24px; right: 24px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 16px 24px; border-radius: 12px; transform: translateX(150%); transition: transform 0.3s; z-index: 9999; display: flex; gap: 12px; align-items: center; }
    .toast.show { transform: translateX(0); }
    @media (max-width: 768px) { .settings-container { grid-template-columns: 1fr; } .settings-form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container">
      <div class="page-heading"><h2>Settings</h2><p>Manage your account profile and security.</p></div>
      
      <div class="settings-container">
        <div class="settings-menu">
          <button class="settings-menu-btn active"><i data-lucide="user"></i> Profile & Security</button>
        </div>
        
        <div class="settings-content">
          <div style="display: flex; align-items: center; gap: 24px; margin-bottom: 32px;">
            <div class="avatar-large" id="settingsAvatar">U</div>
            <div>
              <h4 style="margin: 0 0 4px; font-size: 16px;">Your Avatar</h4>
              <p class="muted" style="margin: 0; font-size: 13px;">Initials update automatically.</p>
            </div>
          </div>

          <div class="settings-form-grid">
            <div class="premium-form-group">
              <label>First Name</label>
              <div class="input-wrapper">
                <i data-lucide="type" class="input-icon"></i>
                <input type="text" class="premium-input" id="setFirstName">
              </div>
            </div>
            <div class="premium-form-group">
              <label>Last Name</label>
              <div class="input-wrapper">
                <i data-lucide="type" class="input-icon"></i>
                <input type="text" class="premium-input" id="setLastName">
              </div>
            </div>
            
            <div class="premium-form-group full">
              <label>Phone Number</label>
              <div class="input-wrapper">
                <i data-lucide="phone" class="input-icon"></i>
                <input type="tel" class="premium-input" id="setPhone" placeholder="+234 800 000 0000">
              </div>
            </div>
          </div>

          <!-- SECURITY SECTION -->
          <div class="section-title">Security & Login</div>
          <div class="settings-form-grid">
            <div class="premium-form-group full">
              <label>Email Address</label>
              <div class="input-wrapper">
                <i data-lucide="mail" class="input-icon"></i>
                <input type="email" class="premium-input" id="setEmail">
              </div>
            </div>
            <div class="premium-form-group full">
              <label>New Password (Leave blank to keep current)</label>
              <div class="input-wrapper">
                <i data-lucide="lock" class="input-icon"></i>
                <input type="password" class="premium-input" id="setPassword" placeholder="Min. 8 characters">
              </div>
            </div>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: 32px;">
            <button class="btn-premium" id="saveBtn" style="width: auto; padding: 0 32px;">Save Changes</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="successToast" class="toast">
  <i data-lucide="check-circle" style="width: 24px; height: 24px;"></i>
  <div><div style="font-weight: 600; font-size: 14px;">Success!</div><div style="font-size: 13px;">Your settings have been updated.</div></div>
</div>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/api.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    if (window.lucide) lucide.createIcons();
    const setFirstName = document.getElementById("setFirstName");
    const setLastName = document.getElementById("setLastName");
    const setEmail = document.getElementById("setEmail");
    const setPhone = document.getElementById("setPhone");
    const setPassword = document.getElementById("setPassword");
    const settingsAvatar = document.getElementById("settingsAvatar");
    const saveBtn = document.getElementById("saveBtn");
    const toast = document.getElementById("successToast");

    // Load data
    try {
      const data = await apiFetch("/auth/me");
      setFirstName.value = data.user.firstName || "";
      setLastName.value = data.user.lastName || "";
      setEmail.value = data.user.email || "";
      setPhone.value = data.user.phone || "";
      settingsAvatar.textContent = `${data.user.firstName?.[0] || ""}${data.user.lastName?.[0] || ""}`.toUpperCase();
    } catch (error) { console.error("Failed to load profile", error); }

    // Save data
    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      const payload = {
        firstName: setFirstName.value.trim(),
        lastName: setLastName.value.trim(),
        phone: setPhone.value.trim(),
        email: setEmail.value.trim(),
      };

      if (setPassword.value) {
        if (setPassword.value.length < 8) {
          alert("Password must be at least 8 characters.");
          saveBtn.disabled = false;
          saveBtn.textContent = "Save Changes";
          return;
        }
        payload.newPassword = setPassword.value;
      }

      try {
        const response = await apiFetch("/auth/profile", {
          method: "PUT",
          body: JSON.stringify(payload),
        });
        
        // Update cache
        const cachedUser = getUser();
        if (cachedUser) {
          cachedUser.firstName = response.firstName;
          cachedUser.lastName = response.lastName;
          cachedUser.email = response.email;
          setUser(cachedUser);
        }

        settingsAvatar.textContent = `${response.firstName?.[0] || ""}${response.lastName?.[0] || ""}`.toUpperCase();
        
        // Show Toast
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
        setTimeout(() => window.location.reload(), 1500);

      } catch (err) {
        alert(err.message || "Failed to update profile");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Changes";
      }
    });
  });
</script>
</body>
</html>
