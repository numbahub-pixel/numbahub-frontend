<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receive SMS — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  
<div id="sidebar"></div>

  <div class="overlay"></div>
  <div class="main">

    <main class="container">
      
<div class="page-heading">
  <h2>Receive SMS</h2>
  <p>Get verification codes without using your personal number.</p>
</div>
<div class="page-layout">
  <div class="card">
    <div class="form-grid">
      <div class="field">
        <label>Country</label>
        <select class="select">
          <option>Choose a country</option>
          <option>Nigeria</option>
          <option>United States</option>
          <option>United Kingdom</option>
        </select>
      </div>
    </div>
    <div class="form-grid">
      <div class="field">
        <label>Service</label>
        <select class="select">
          <option>Choose a service</option>
          <option>Google</option>
          <option>Telegram</option>
          <option>WhatsApp</option>
        </select>
      </div>
    </div>
    <div class="form-grid">
      <div class="field">Cost<select class="input"></select></div>
      
    </div>
    <button class="blue-button" style="margin-top:20px;">Get number</button>
  </div>
  <div class="helper-box">
    <h3>How it works</h3>
    <ol>
      <li>Choose a country.</li>
      <li>Select the service.</li>
      <li>Get your temporary number.</li>
      <li>Receive the verification code.</li>
    </ol>
  </div>
</div>

    </main>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
