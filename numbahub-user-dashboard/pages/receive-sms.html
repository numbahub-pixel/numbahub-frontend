<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receive SMS — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container">
      <div class="page-heading" style="margin-bottom: 32px;">
        <h2 style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px;">Receive SMS</h2>
        <p style="font-size: 15px; color: var(--muted); margin-top: 4px;">Retrieve your active numbers and view verification codes.</p>
      </div>

      <div id="activeOrdersGrid" class="grid-3">
        <!-- Initial Skeleton Loader -->
        <div class="sms-card" style="opacity: 0.6;">
           <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
              <div style="width: 40px; height: 40px; border-radius: 12px; background: #e2e8f0;"></div>
              <div style="width: 60px; height: 28px; border-radius: 20px; background: #e2e8f0;"></div>
           </div>
           <div style="height: 80px; background: #e2e8f0; border-radius: 16px; margin-bottom: 20px;"></div>
           <div style="height: 48px; background: #e2e8f0; border-radius: 12px;"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const grid = document.getElementById("activeOrdersGrid");
    let activeOrders = [];
    let timerInterval;

    // 1. Fetch Active Orders
    async function loadOrders() {
      try {
        const data = await apiFetch("/rent/active-orders");
        activeOrders = data.orders || [];
        
        if (activeOrders.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; background: rgba(255,255,255,0.6); backdrop-filter: blur(10px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
              <div style="width: 80px; height: 80px; background: #eff6ff; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px;">
                <i data-lucide="inbox" style="width: 36px; height: 36px; color: var(--brand);"></i>
              </div>
              <h3 style="margin-bottom: 8px; font-size: 20px; font-weight: 800; color: var(--text);">No Active Numbers</h3>
              <p class="muted" style="font-size: 15px; margin-bottom: 24px;">You don't have any active SMS activations right now.</p>
              <a href="rent.html" class="blue-button" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 12px 24px;">
                <i data-lucide="plus" style="width: 18px;"></i> Rent a Number
              </a>
            </div>
          `;
          if (window.lucide) lucide.createIcons();
          return;
        }

        renderOrders();
      } catch (error) {
        grid.innerHTML = `<p class="text-red-500" style="grid-column: 1/-1; text-align: center; padding: 40px; font-weight: 600;">Failed to load activations: ${error.message}</p>`;
      }
    }

    // 2. Render Premium Cards
    function renderOrders() {
      grid.innerHTML = activeOrders.map(order => {
        const phone = order.details.phoneNumber;
        const service = order.details.serviceCode;
        const expiry = new Date(order.details.expiresAt).getTime();
        const now = Date.now();
        const timeLeft = Math.max(0, Math.floor((expiry - now) / 1000));
        
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        const timeStr = timeLeft > 0 ? `${mins}:${secs.toString().padStart(2, '0')}` : "Expired";

        return `
          <div class="sms-card" id="card-${order.providerReference}">
            
            <!-- Header -->
            <div class="sms-header">
              <div style="display:flex; align-items:center; gap:12px;">
                <div class="sms-service-icon">
                  <i data-lucide="message-square" style="width: 20px;"></i>
                </div>
                <div>
                  <h3 style="margin:0; font-size:16px; font-weight:800; text-transform:capitalize; color: var(--text);">${service}</h3>
                  <p style="margin: 2px 0 0; font-size: 12px; color: var(--muted); font-weight: 500;">Verification Number</p>
                </div>
              </div>
              
              <span class="sms-timer ${timeLeft > 0 ? 'active' : 'expired'}" id="timer-${order.providerReference}">
                <span class="sms-timer-dot" ${timeLeft === 0 ? 'style="display:none;"' : ''}></span>
                ${timeStr}
              </span>
            </div>
            
            <!-- Phone Number -->
            <div class="phone-display-box">
              <div style="font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px;">Your Number</div>
              <div class="phone-number">${phone}</div>
            </div>

            <!-- Result Area -->
            <div class="sms-result-area" id="smsResult-${order.providerReference}">
               <div class="sms-waiting-box">
                 <i data-lucide="loader" style="width: 24px; height: 24px; animation: spin 2s linear infinite;"></i>
                 Click "Check SMS" to retrieve your code.
               </div>
            </div>
            
            <!-- Actions -->
            <div class="sms-actions">
              <button class="sms-btn-check" 
                onclick="checkSmsCode('${order.providerReference}', this)" ${timeLeft <= 0 ? 'disabled' : ''}>
                <i data-lucide="refresh-cw" style="width: 16px;"></i> Check SMS
              </button>
              <button class="sms-btn-cancel" 
                onclick="finishOrder('${order.providerReference}', this)">
                ${timeLeft > 0 ? 'Cancel' : 'Clear'}
              </button>
            </div>
          </div>
        `;
      }).join('');
      
      if (window.lucide) lucide.createIcons();
    }

    // 3. Live Countdown Timer
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        activeOrders.forEach(order => {
          const timerEl = document.getElementById(`timer-${order.providerReference}`);
          if (!timerEl) return;
          
          const expiry = new Date(order.details.expiresAt).getTime();
          const now = Date.now();
          const timeLeft = Math.max(0, Math.floor((expiry - now) / 1000));
          
          if (timeLeft === 0) {
            timerEl.className = "sms-timer expired";
            timerEl.innerHTML = "Expired";
            
            const btn = timerEl.closest('.sms-card').querySelector('.sms-btn-check');
            if (btn) btn.disabled = true;
            
            const cancelBtn = timerEl.closest('.sms-card').querySelector('.sms-btn-cancel');
            if (cancelBtn) cancelBtn.textContent = "Clear";
            return;
          }

          const mins = Math.floor(timeLeft / 60);
          const secs = timeLeft % 60;
          timerEl.innerHTML = `<span class="sms-timer-dot"></span> ${mins}:${secs.toString().padStart(2, '0')}`;
        });
      }, 1000);
    }

    // 4. Check SMS Code
    window.checkSmsCode = async (orderId, btn) => {
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader" style="width: 16px; animation: spin 1s linear infinite;"></i> Checking...`;
      if (window.lucide) lucide.createIcons();
      
      const resultDiv = document.getElementById(`smsResult-${orderId}`);
      resultDiv.innerHTML = `<div class="sms-waiting-box"><i data-lucide="loader" style="width: 24px; height: 24px; animation: spin 2s linear infinite;"></i> Fetching from provider...</div>`;
      if (window.lucide) lucide.createIcons();

      try {
        const data = await apiFetch(`/rent/check/${orderId}`);
        
        if (data.sms && data.sms.length > 0) {
          // Code received!
          const code = data.sms[0].code;
          resultDiv.innerHTML = `
            <div class="sms-success-box">
              <div style="font-size: 12px; color: #065f46; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Verification Code</div>
              <div class="sms-code-text">${code}</div>
              <button class="sms-copy-btn" onclick="copyCode('${code}')">
                <i data-lucide="copy" style="width: 14px;"></i> Copy Code
              </button>
            </div>
          `;
          if (window.lucide) lucide.createIcons();
        } else {
          // No SMS yet
          resultDiv.innerHTML = `
            <div class="sms-waiting-box">
              <i data-lucide="clock" style="width: 24px; height: 24px; color: #60a5fa;"></i>
              <div>Waiting for SMS...</div>
              <div style="font-size: 12px; color: #64748b;">Make sure you entered the number correctly in the app.</div>
            </div>
          `;
          if (window.lucide) lucide.createIcons();
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="sms-waiting-box" style="border-color: #fca5a5; color: #dc2626;">
            <i data-lucide="alert-circle" style="width: 24px;"></i>
            <div>${error.message}</div>
          </div>
        `;
        if (window.lucide) lucide.createIcons();
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
        if (window.lucide) lucide.createIcons();
      }
    };

    // 5. Copy Code Helper
    window.copyCode = (code) => {
      navigator.clipboard.writeText(code).then(() => {
        alert("Code copied to clipboard!");
      });
    };

    // 6. Finish / Cancel Order
    window.finishOrder = async (orderId, btn) => {
      if (!confirm("Are you sure? This will release the number permanently.")) return;
      
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Clearing...";
      
      try {
        await apiFetch(`/rent/finish/${orderId}`, { method: "POST" });
        document.getElementById(`card-${orderId}`).remove();
        
        if (document.querySelectorAll('.sms-card').length === 0) {
          loadOrders();
        }
      } catch (error) {
        alert(error.message || "Failed to finish order.");
        btn.disabled = false;
        btn.textContent = originalText;
      }
    };

    // Init
    await loadOrders();
    if (activeOrders.length > 0) startTimer();
  });
</script>
</body>
</html>
