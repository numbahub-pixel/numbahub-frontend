<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  
<div id="sidebar"></div>

  <div class="overlay"></div>
  <div class="main">
    
<header class="topbar">
  <div style="display:flex;align-items:center;gap:14px;">
    <button class="icon-button mobile-menu" data-menu aria-label="Open menu"><i data-lucide="menu"></i></button>
    <div>
      <div class="page-kicker">History</div>
      <h1 class="page-title">History</h1>
    </div>
  </div>
  <div class="top-actions">
    <button class="icon-button"><i data-lucide="headphones"></i></button>
    <button class="icon-button"><i data-lucide="bell"></i></button>
    <div class="profile">
      <div class="avatar">BA</div>
      <div class="profile-info">
        <strong>Busari Abdulsalam<br>Damilola</strong>
        <span>user@example.com</span>
      </div>
      <span style="color:#8792a3"><i data-lucide="chevron-down"></i></span>
    </div>
  </div>
</header>

    <main class="container">
      
<div class="page-heading"><h2>Transaction History</h2><p>View your recent account activity.</p></div>
<div class="card">
  <div class="toolbar"><input class="input" data-search placeholder="Search transactions..."><select class="select" style="max-width:180px;"><option>All statuses</option><option>Successful</option><option>Pending</option><option>Failed</option></select></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Reference</th><th>Service</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
      <tbody>
        <tr data-searchable><td>#NU-00001</td><td>Receive SMS</td><td>$0.00</td><td><span class="status success">Successful</span></td><td>—</td></tr>
        <tr data-searchable><td>#NU-00002</td><td>eSIM</td><td>$0.00</td><td><span class="status pending">Pending</span></td><td>—</td></tr>
      </tbody>
    </table>
  </div>
</div>

    </main>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
