<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giftcards — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  
<div id="sidebar"></div>

  <div class="overlay"></div>
  <div class="main">
    
<header class="topbar">
  <div style="display:flex;align-items:center;gap:14px;">
    <button class="icon-button mobile-menu" data-menu aria-label="Open menu"><i data-lucide="menu"></i></button>
    <div>
      <div class="page-kicker">Giftcards</div>
      <h1 class="page-title">Giftcards</h1>
    </div>
  </div>
  <div class="top-actions">
    <button class="icon-button"><i data-lucide="headphones"></i></button>
    <button class="icon-button"><i data-lucide="bell"></i></button>
    <div class="profile">
      <div class="avatar">BA</div>
      <div class="profile-info">
        <strong>Busari Abdulsalam<br>Damilola</strong>
        <span>user@example.com</span>
      </div>
      <span style="color:#8792a3"><i data-lucide="chevron-down"></i></span>
    </div>
  </div>
</header>

    <main class="container">
      
<div class="page-heading"><h2>Giftcards</h2><p>Buy supported digital gift cards.</p></div>
<div class="grid-3">
<div class="product-card"><h3>Amazon</h3><p class="muted">Digital gift card</p><button class="blue-button" data-action="buy" style="margin-top:20px;">Buy gift card</button></div><div class="product-card"><h3>Apple</h3><p class="muted">Digital gift card</p><button class="blue-button" data-action="buy" style="margin-top:20px;">Buy gift card</button></div><div class="product-card"><h3>Google Play</h3><p class="muted">Digital gift card</p><button class="blue-button" data-action="buy" style="margin-top:20px;">Buy gift card</button></div><div class="product-card"><h3>Steam</h3><p class="muted">Digital gift card</p><button class="blue-button" data-action="buy" style="margin-top:20px;">Buy gift card</button></div><div class="product-card"><h3>PlayStation</h3><p class="muted">Digital gift card</p><button class="blue-button" data-action="buy" style="margin-top:20px;">Buy gift card</button></div><div class="product-card"><h3>Xbox</h3><p class="muted">Digital gift card</p><button class="blue-button" data-action="buy" style="margin-top:20px;">Buy gift card</button></div>
</div>

    </main>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
