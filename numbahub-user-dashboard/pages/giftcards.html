<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giftcards — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container" style="max-width: 700px;">
      <div class="page-heading" style="display: flex; align-items: center; gap: 12px;">
        <button onclick="window.location.href='../index.html'" class="icon-button" style="width: 40px; height: 40px;"><i data-lucide="arrow-left" style="width: 18px;"></i></button>
        <div>
          <h2 style="margin: 0; font-size: 24px; font-weight: 800;">Buy Giftcard</h2>
          <p style="margin: 4px 0 0;">Select a country to browse available brands.</p>
        </div>
      </div>

      <div class="premium-card" style="padding: 24px;">
        <div style="position: relative; margin-bottom: 24px;">
          <i data-lucide="search" style="position: absolute; left: 16px; top: 16px; color: #94a3b8; width: 20px;"></i>
          <input type="text" id="countrySearch" class="premium-input" placeholder="Search for a country..." style="padding-left: 48px; height: 56px; font-size: 16px;" onkeyup="filterCountries()">
        </div>

        <div id="countryList" class="country-list">
          <p class="muted" style="text-align: center;">Loading countries...</p>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script>
  let allCountries = [];

  document.addEventListener("DOMContentLoaded", async () => {
    if (window.lucide) lucide.createIcons();
    const list = document.getElementById("countryList");

    try {
      const data = await apiFetch("/giftcard/countries");
      allCountries = data.countries || [];
      renderCountries(allCountries);
    } catch (error) {
      list.innerHTML = `<p style="color:#ef4444; text-align:center;">Failed to load countries: ${error.message}</p>`;
    }
  });

  function renderCountries(countries) {
    const list = document.getElementById("countryList");
    if (countries.length === 0) {
      list.innerHTML = `<p class="muted" style="text-align:center;">No countries found.</p>`;
      return;
    }

    list.innerHTML = countries.map(c => {
      const flagUrl = `https://flagcdn.com/w80/${c.code.substring(0,2).toLowerCase()}.png`;
      return `
        <div class="country-item" onclick="goToBrands('${c.code}')">
          <div style="display: flex; align-items: center; gap: 16px;">
            <img src="${flagUrl}" class="country-flag">
            <span style="font-weight: 700; font-size: 16px; color: var(--text);">${c.name}</span>
          </div>
          <i data-lucide="chevron-right" style="color: var(--brand); width: 20px;"></i>
        </div>
      `;
    }).join('');
    if (window.lucide) lucide.createIcons();
  }

  function filterCountries() {
    const query = document.getElementById("countrySearch").value.toLowerCase();
    const filtered = allCountries.filter(c => c.name.toLowerCase().includes(query));
    renderCountries(filtered);
  }

  function goToBrands(countryCode) {
    window.location.href = `giftcard-brands.html?country=${countryCode}`;
  }
</script>
</body>
</html>
