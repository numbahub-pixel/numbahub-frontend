<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fund Wallet — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* =========================================
       SMART & SLEEK FUND WALLET STYLES
       ========================================= */
    
    /* Segmented Tabs */
    .smart-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .smart-tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .smart-tab.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Currency Selector */
    .currency-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .currency-row::-webkit-scrollbar { display: none; }
    
    .currency-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .currency-pill:hover { border-color: #cbd5e1; }
    .currency-pill.active {
      border-color: var(--brand);
      background: #eff6ff;
    }
    .currency-pill img { width: 20px; height: 14px; border-radius: 2px; }
    .currency-pill span { font-size: 14px; font-weight: 700; color: var(--text); }

    /* Elegant Amount Input */
    .smart-amount-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
      position: relative;
      transition: border-color 0.2s;
    }
    .smart-amount-box:focus-within {
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(67,137,238,0.1);
    }
    .smart-amount-box label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .smart-input-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
      color: var(--text);
    }
    .smart-input-wrapper span {
      color: #94a3b8;
      margin-right: 4px;
      font-size: 32px;
    }
    .smart-input {
      width: 100%;
      max-width: 200px;
      border: none;
      background: transparent;
      outline: none;
      font-size: 48px;
      font-weight: 800;
      color: var(--text);
      text-align: center;
    }
    .smart-input::placeholder { color: #cbd5e1; }
    
    .smart-conversion {
      font-size: 14px;
      font-weight: 600;
      color: var(--brand);
      margin-top: 8px;
    }

    /* Presets */
    .smart-presets {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .smart-preset {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: 0.2s;
    }
    .smart-preset:hover { border-color: var(--brand); color: var(--brand); }
    .smart-preset.active {
      background: var(--brand); color: #fff; border-color: var(--brand);
    }

    /* Smart Action Button */
    .smart-action-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px -6px rgba(67, 137, 238, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .smart-action-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -6px rgba(67, 137, 238, 0.5);
    }
    .smart-action-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Security Footer */
    .smart-security {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
    .smart-security i { width: 14px; height: 14px; color: #10b981; }
  </style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container" style="max-width: 500px;">
      
      <!-- Page Header -->
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <button onclick="window.location.href='../index.html'" class="icon-button" style="width: 40px; height: 40px; background: #fff; border: 1px solid var(--border);">
          <i data-lucide="arrow-left" style="width: 18px;"></i>
        </button>
        <div>
          <h2 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.5px;">Fund Wallet</h2>
        </div>
      </div>

      <!-- Main Card -->
      <div class="premium-card" style="padding: 24px;">
        
        <!-- Segmented Control -->
        <div class="smart-tabs">
          <button id="tabLocal" class="smart-tab active" onclick="switchTab('local')">Local Bank</button>
          <button id="tabCrypto" class="smart-tab" onclick="switchTab('crypto')">Crypto</button>
        </div>

        <!-- LOCAL CONTENT -->
        <div id="contentLocal">
          
          <label style="font-weight: 600; font-size: 13px; color: var(--text); margin-bottom: 12px; display: block;">Select Currency</label>
          
          <!-- Compact Currency Pills -->
          <div class="currency-row">
            <div class="currency-pill active" onclick="selectCurrency('NGN', this)">
              <img src="https://flagcdn.com/w40/ng.png" alt="NGN">
              <span>NGN</span>
            </div>
            <div class="currency-pill" onclick="selectCurrency('GHS', this)">
              <img src="https://flagcdn.com/w40/gh.png" alt="GHS">
              <span>GHS</span>
            </div>
            <div class="currency-pill" onclick="selectCurrency('KES', this)">
              <img src="https://flagcdn.com/w40/ke.png" alt="KES">
              <span>KES</span>
            </div>
            <div class="currency-pill" onclick="selectCurrency('ZAR', this)">
              <img src="https://flagcdn.com/w40/za.png" alt="ZAR">
              <span>ZAR</span>
            </div>
          </div>

          <!-- Smart Amount Input -->
          <div class="smart-amount-box">
            <label>Amount to deposit (USD)</label>
            <div class="smart-input-wrapper">
              <span>$</span>
              <input type="number" id="amountInput" class="smart-input" value="" placeholder="0" oninput="updateConversion()">
            </div>
            <div class="smart-conversion" id="conversionText">≈ NGN 0.00</div>
          </div>

          <!-- Presets -->
          <div class="smart-presets">
            <button class="smart-preset" onclick="setPresetAmount(20, this)">$20</button>
            <button class="smart-preset" onclick="setPresetAmount(50, this)">$50</button>
            <button class="smart-preset" onclick="setPresetAmount(100, this)">$100</button>
            <button class="smart-preset" onclick="setPresetAmount(500, this)">$500</button>
          </div>

          <div id="localError" class="hidden text-red-500" style="font-size: 13px; margin-bottom: 12px; text-align: center; font-weight: 600;"></div>
          
          <!-- Smart Action Button -->
          <button class="smart-action-btn" id="payLocalBtn">
            Proceed to Payment
          </button>

          <!-- Security Footer -->
          <div class="smart-security">
            <i data-lucide="lock"></i> Secured by Kora Pay
          </div>
        </div>

        <!-- CRYPTO CONTENT -->
        <div id="contentCrypto" style="display: none;">
          <div style="text-align: center; padding: 40px 10px;">
            <i data-lucide="bitcoin" style="width: 48px; height: 48px; color: #cbd5e1; margin: 0 auto 16px;"></i>
            <h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; color: var(--text);">Crypto Coming Soon</h3>
            <p class="muted" style="font-size: 13px;">We are upgrading our crypto payment gateway.</p>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script>
  let currentRate = 1500; 
  let selectedCurrency = "NGN";
  let usdAmount = 0;

  const RATES = {
    NGN: 1500,
    GHS: 15,
    KES: 130,
    ZAR: 18.5
  };

  document.addEventListener("DOMContentLoaded", async () => {
    if (window.lucide) lucide.createIcons();

    try {
      const rateData = await apiFetch("/currency/rate", { auth: false });
      currentRate = rateData.rate || 1500;
      RATES.NGN = currentRate; 
      updateConversion();
    } catch(e) {}

    document.getElementById("payLocalBtn").addEventListener("click", async (e) => {
      const btn = e.target;
      const errorEl = document.getElementById("localError");
      
      if (usdAmount < 5) {
        errorEl.textContent = "Minimum funding is $5.00.";
        errorEl.classList.remove("hidden");
        return;
      }

      const ngnAmount = Math.round(usdAmount * RATES.NGN);

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader" style="width: 18px; height: 18px; animation: spin 1s linear infinite;"></i> Initializing...`;
      if (window.lucide) lucide.createIcons();
      errorEl.classList.add("hidden");

      try {
        const data = await apiFetch("/wallet/fund", {
          method: "POST",
          body: JSON.stringify({ amount: ngnAmount })
        });
        if (data.checkoutUrl) window.location.href = data.checkoutUrl;
      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.classList.remove("hidden");
        btn.disabled = false;
        btn.innerHTML = `Proceed to Payment`;
        if (window.lucide) lucide.createIcons();
      }
    });
  });

  window.switchTab = (tab) => {
    document.getElementById("tabLocal").classList.toggle("active", tab === "local");
    document.getElementById("tabCrypto").classList.toggle("active", tab === "crypto");
    document.getElementById("contentLocal").style.display = tab === "local" ? "block" : "none";
    document.getElementById("contentCrypto").style.display = tab === "crypto" ? "block" : "none";
  };

  window.selectCurrency = (currency, element) => {
    selectedCurrency = currency;
    document.querySelectorAll(".currency-pill").forEach(el => el.classList.remove("active"));
    element.classList.add("active");
    updateConversion();
  };

  window.setPresetAmount = (amount, btn) => {
    document.getElementById("amountInput").value = amount;
    updateAmountPill(btn);
    updateConversion();
  };

  function updateAmountPill(btn) {
    document.querySelectorAll(".smart-preset").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
  }

  window.updateConversion = () => {
    const inputVal = document.getElementById("amountInput").value;
    usdAmount = parseFloat(inputVal) || 0;
    const localAmount = usdAmount * RATES[selectedCurrency];
    
    document.getElementById("conversionText").textContent = `≈ ${selectedCurrency} ${localAmount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  };
</script>
</body>
</html>
