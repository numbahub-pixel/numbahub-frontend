<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help & Support | NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* 🟢 FIXED: Display none by default to stop the flickering */
    .modal-overlay { 
      display: none; /* Hide it completely on load */
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); 
      align-items: center; justify-content: center; z-index: 9999; padding: 16px; 
      opacity: 0; visibility: hidden; transition: all 0.2s ease; 
    }
    
    /* 🟢 Only show it when active */
    .modal-overlay.active { 
      display: flex;
      opacity: 1; 
      visibility: visible; 
    }
    
    .premium-modal { background: #fff; width: 100%; max-width: 600px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); transform: translateY(20px); transition: transform 0.2s ease; overflow: hidden; display: flex; flex-direction: column; height: 80vh; }
    .modal-overlay.active .premium-modal { transform: translateY(0); }
    
    .chat-container { flex: 1; overflow-y: auto; padding: 24px; background: #f8fafc; display: flex; flex-direction: column; gap: 16px; }
    .chat-bubble { max-width: 80%; padding: 14px 18px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
    .chat-user { background: #3179df; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-admin { background: #fff; border: 1px solid #e2e8f0; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-meta { font-size: 11px; margin-bottom: 6px; display: block; opacity: 0.8; }
  </style>
</head>
<body class="bg-[#fafafa] text-slate-900">
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container p-4 md:p-8 max-w-[1200px] mx-auto space-y-6">
      
      <div class="mb-8">
        <h2 class="text-2xl font-bold text-slate-900">Help & Support</h2>
        <p class="text-slate-500 mt-1">Open a ticket and our team will get back to you within 24 hours.</p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Create Ticket Form -->
        <div class="lg:col-span-1">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h3 class="text-base font-bold text-slate-900 mb-4">Create New Ticket</h3>
            <form id="createTicketForm" class="space-y-4">
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Subject</label>
                <input type="text" id="ticketSubject" required class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50 transition" placeholder="e.g. Deposit not reflecting">
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Priority</label>
                <select id="ticketPriority" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50 transition cursor-pointer">
                  <option value="Normal">Normal</option>
                  <option value="High">High</option>
                  <option value="Urgent">Urgent</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Message</label>
                <textarea id="ticketMessage" required rows="4" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50 transition resize-none" placeholder="Describe your issue in detail..."></textarea>
              </div>
              <button type="submit" id="submitTicketBtn" class="w-full rounded-xl bg-blue-600 px-4 py-3 text-sm font-bold text-white transition hover:bg-blue-700 shadow-md shadow-blue-500/20">Submit Ticket</button>
            </form>
          </div>
        </div>

        <!-- Ticket History -->
        <div class="lg:col-span-2">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-full">
            <h3 class="text-base font-bold text-slate-900 mb-4">My Tickets</h3>
            <div id="myTicketsList" class="space-y-3">
              <p class="text-sm text-slate-500 text-center py-10">Loading your tickets...</p>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- 🟢 USER CHAT MODAL -->
<div class="modal-overlay" id="userTicketModal">
  <div class="premium-modal">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white">
      <div>
        <h2 class="text-base font-bold text-slate-900" id="uModalSubject">Ticket</h2>
        <div class="text-xs font-semibold text-slate-500 mt-1" id="uModalStatus">Status</div>
      </div>
      <button class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center" onclick="closeUserTicket()"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="chat-container" id="uChatContainer">
      <p class="text-center text-slate-400 text-sm">Loading chat...</p>
    </div>
    <div class="px-6 py-4 border-t border-slate-100 bg-white">
      <div class="flex gap-3 items-end">
        <textarea id="uReplyInput" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500 focus:bg-white transition resize-none" rows="1" placeholder="Type a message..."></textarea>
        <button class="px-5 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md transition hover:bg-blue-700" id="uSendReplyBtn" onclick="userSendReply()">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    if (window.lucide) lucide.createIcons();
    loadMyTickets();

    document.getElementById("createTicketForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitTicketBtn");
      btn.disabled = true; btn.textContent = "Submitting...";

      try {
        await apiFetch("/support/ticket", {
          method: "POST",
          body: JSON.stringify({
            subject: document.getElementById("ticketSubject").value.trim(),
            priority: document.getElementById("ticketPriority").value,
            message: document.getElementById("ticketMessage").value.trim()
          })
        });
        alert("Ticket created successfully!");
        e.target.reset();
        loadMyTickets();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false; btn.textContent = "Submit Ticket";
      }
    });
  });

  async function loadMyTickets() {
    const list = document.getElementById("myTicketsList");
    try {
      const data = await apiFetch("/support/my-tickets");
      
      if (data.tickets.length === 0) {
        list.innerHTML = `<p class="text-sm text-slate-500 text-center py-10">You have no active tickets.</p>`;
        return;
      }
      
      list.innerHTML = data.tickets.map(t => {
        let statusColor = t.status === "Resolved" ? "bg-emerald-50 text-emerald-700" : t.status === "Pending" ? "bg-orange-50 text-orange-700" : "bg-blue-50 text-blue-700";
        return `
          <div class="flex justify-between items-center p-4 border border-slate-100 rounded-xl hover:bg-slate-50 transition cursor-pointer" onclick="openUserTicket('${t._id}')">
            <div>
              <div class="font-bold text-slate-900 text-sm">${t.subject}</div>
              <div class="text-xs text-slate-500 mt-1 font-medium">${new Date(t.updatedAt).toLocaleDateString()}</div>
            </div>
            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${statusColor}">${t.status}</span>
          </div>
        `;
      }).join('');
    } catch (err) {
      // 🟢 NOW SHOWING EXACT ERROR
      list.innerHTML = `<p class="text-sm text-red-500 text-center py-10">${err.message}</p>`;
    }
  }

  let activeUserTicketId = null;

  window.openUserTicket = async (id) => {
    activeUserTicketId = id;
    document.getElementById("userTicketModal").classList.add("active");
    document.getElementById("uChatContainer").innerHTML = `<p class="text-center text-sm text-slate-400">Loading...</p>`;
    
    try {
      const t = await apiFetch(`/support/my-tickets/${id}`);
      document.getElementById("uModalSubject").textContent = t.subject;
      document.getElementById("uModalStatus").textContent = `Status: ${t.status}`;

      let html = `<div class="chat-bubble chat-user"><span class="chat-meta">You • ${new Date(t.createdAt).toLocaleTimeString()}</span>${t.message}</div>`;
      
      t.replies.forEach(r => {
        const isMe = r.senderName.includes("Support") ? false : true;
        html += `<div class="chat-bubble ${isMe ? 'chat-user' : 'chat-admin'}"><span class="chat-meta">${r.senderName}</span>${r.message}</div>`;
      });

      const container = document.getElementById("uChatContainer");
      container.innerHTML = html;
      container.scrollTop = container.scrollHeight;
    } catch (err) {
      alert("Failed to load chat: " + err.message);
    }
  };

  window.closeUserTicket = () => {
    document.getElementById("userTicketModal").classList.remove("active");
    activeUserTicketId = null;
  };

  window.userSendReply = async () => {
    if (!activeUserTicketId) return;
    const input = document.getElementById("uReplyInput");
    const message = input.value.trim();
    if (!message) return;

    try {
      await apiFetch(`/support/my-tickets/${activeUserTicketId}/reply`, {
        method: "POST",
        body: JSON.stringify({ message })
      });
      
      const container = document.getElementById("uChatContainer");
      container.innerHTML += `<div class="chat-bubble chat-user"><span class="chat-meta">You • Just now</span>${message}</div>`;
      container.scrollTop = container.scrollHeight;
      input.value = "";
    } catch (err) {
      alert(err.message);
    }
  };
</script>
</body>
</html>
