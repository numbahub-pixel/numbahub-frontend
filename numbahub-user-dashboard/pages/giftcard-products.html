<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Amount — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container" style="max-width: 900px;">
      <div class="page-heading" style="display: flex; align-items: center; gap: 12px;">
        <button onclick="window.history.back()" class="icon-button" style="width: 40px; height: 40px;"><i data-lucide="arrow-left" style="width: 18px;"></i></button>
        <div>
          <h2 style="margin: 0; font-size: 24px; font-weight: 800;">Select Amount</h2>
          <p style="margin: 4px 0 0;">Choose the value of your gift card.</p>
        </div>
      </div>

      <div class="grid-3" id="productGrid">
        <p>Loading...</p>
      </div>
    </main>
  </div>
</div>

<!-- PREMIUM PURCHASE MODAL -->
<div id="buyGcModal" class="modal-overlay hidden">
  <div class="premium-modal">
    <div class="modal-icon-wrap">
      <i data-lucide="shopping-bag" style="width: 28px; height: 28px;"></i>
    </div>
    <h3 style="font-size: 20px; font-weight: 800; color: var(--text); margin: 0 0 8px;">Confirm Purchase</h3>
    <p style="font-size: 14px; color: var(--muted); margin: 0 0 24px;">Review your order details below.</p>
    
    <div class="premium-receipt">
      <div style="font-size: 13px; color: var(--muted); margin-bottom: 4px;">Item</div>
      <div style="font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 16px;" id="gcConfirmName">Gift Card</div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-size: 14px; color: var(--muted); font-weight: 500;">Card Value</span>
        <strong style="font-size: 16px; color: var(--text);" id="gcConfirmUsd">$0</strong>
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #cbd5e1; padding-top: 16px; margin-top: 16px;">
        <span style="font-size: 14px; font-weight: 600; color: var(--text);">Total Charge</span>
        <strong style="font-size: 22px; color: var(--brand);" id="gcConfirmPrice">₦0.00</strong>
      </div>
    </div>

    <div style="margin-bottom: 24px; text-align: left;">
      <label style="font-size: 13px; font-weight: 600; margin-bottom: 8px; display: block; color: var(--text);">Recipient Email</label>
      <input type="email" id="gcEmail" placeholder="Enter email for delivery" style="width: 100%; padding: 16px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; background: #f8fafc; font-size: 15px; transition: 0.2s;" onfocus="this.style.borderColor='var(--brand)'; this.style.boxShadow='0 0 0 4px rgba(67,137,238,0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
    </div>

    <div id="gcError" class="hidden text-red-500" style="font-size: 14px; margin-bottom: 12px; text-align: center; font-weight: 500;"></div>
    
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelGcBtn">Cancel</button>
      <button class="btn-pay" id="confirmGcBtn">Pay Now</button>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script>
  let selectedGcData = null;

  function formatPrice(amount) {
    const num = Number(amount);
    if (isNaN(num)) return "0";
    return num % 1 === 0 ? num.toString() : num.toFixed(2);
  }

  document.addEventListener("DOMContentLoaded", async () => {
    if (window.lucide) lucide.createIcons();
    const urlParams = new URLSearchParams(window.location.search);
    const operatorId = urlParams.get('operator');
    const grid = document.getElementById("productGrid");

    if (!operatorId) {
      grid.innerHTML = `<p style="color:red; text-align:center; grid-column:1/-1;">No brand selected. Please go back.</p>`;
      return;
    }

    try {
      const data = await apiFetch(`/giftcard/products/${operatorId}`);
      
      if (!data.products || data.products.length === 0) {
        throw new Error("Gift cards are currently out of stock for this brand.");
      }

      grid.innerHTML = data.products.map(p => {
        const usdValue = p.usd ? p.usd : (p.ngn / 1500); 
        
        return `
        <div class="gc-item">
          <div>
            <div class="gc-title">${p.name}</div>
            <div class="gc-price-usd">$${formatPrice(usdValue)}</div>
            <div class="gc-price-ngn">≈ ₦${p.ngn.toLocaleString()}</div>
          </div>
          <button class="gc-btn" 
            onclick="openBuyModal('${p.id}', '${operatorId}', ${p.ngn}, ${usdValue}, '${p.name}')">
            Buy Now
          </button>
        </div>
      `}).join('');
    } catch (e) { 
      grid.innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 40px; background: rgba(255,255,255,0.6); border-radius: 20px;">
          <p style="color: #ef4444; font-weight: 600; margin-bottom: 16px;">${e.message}</p>
          <button class="blue-button" onclick="window.history.back()" style="margin: 0 auto;">Go Back</button>
        </div>
      `; 
    }
  });

  window.openBuyModal = (productId, operatorId, priceNgn, priceUsd, name) => {
    selectedGcData = { productId, operatorId, priceNgn, priceUsd, name };
    document.getElementById("gcConfirmName").textContent = name;
    document.getElementById("gcConfirmUsd").textContent = `$${formatPrice(priceUsd)}`;
    document.getElementById("gcConfirmPrice").textContent = `₦${priceNgn.toLocaleString()}`;
    document.getElementById("gcEmail").value = "";
    document.getElementById("gcError").classList.add("hidden");
    document.getElementById("buyGcModal").classList.remove("hidden");
  };

  document.getElementById("cancelGcBtn").addEventListener("click", () => {
    document.getElementById("buyGcModal").classList.add("hidden");
    selectedGcData = null;
  });

  document.getElementById("confirmGcBtn").addEventListener("click", async (e) => {
    const btn = e.target;
    const email = document.getElementById("gcEmail").value.trim();
    const errorEl = document.getElementById("gcError");

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errorEl.textContent = "Please enter a valid email address.";
      errorEl.classList.remove("hidden");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Processing...";
    errorEl.classList.add("hidden");

    try {
      await apiFetch("/giftcard/buy", {
        method: "POST",
        body: JSON.stringify({ 
          productId: selectedGcData.productId, 
          operatorId: selectedGcData.operatorId, 
          amount: selectedGcData.priceUsd, 
          email 
        })
      });
      
      document.getElementById("buyGcModal").classList.add("hidden");
      alert("Giftcard purchased successfully! Check History for your redeem code.");
      window.location.href = "history.html";
    } catch (err) {
      errorEl.textContent = err.message || "Failed to purchase gift card.";
      errorEl.classList.remove("hidden");
    } finally {
      btn.disabled = false;
      btn.textContent = "Pay Now";
    }
  });
</script>
</body>
</html>
