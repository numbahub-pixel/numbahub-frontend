<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Amount — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .giftcard-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .giftcard-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px -5px rgba(0,0,0,0.08);
      border-color: #cbd5e1;
    }
    .gc-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .gc-price-usd {
      font-size: 32px;
      font-weight: 800;
      color: var(--brand);
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .gc-price-ngn {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 20px;
    }
    .gc-btn {
      background: var(--brand);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }
    .gc-btn:hover {
      background: var(--brand-dark);
    }
  </style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container" style="max-width: 800px;">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <button onclick="window.history.back()" class="icon-button"><i data-lucide="arrow-left"></i></button>
        <h2 style="margin: 0; font-size: 20px;">Select Amount</h2>
      </div>

      <div class="grid-3" id="productGrid">
        <p>Loading...</p>
      </div>
    </main>
  </div>
</div>

<!-- PREMIUM PURCHASE MODAL -->
<div id="buyGcModal" class="modal-overlay hidden">
  <div class="modal-content" style="text-align: left;">
    <h3 style="text-align: center; margin-bottom: 24px;">Confirm Purchase</h3>
    
    <div style="background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px;">
      <div style="font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 16px; text-align: center;" id="gcConfirmName">Gift Card</div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span class="muted" style="font-size: 14px;">Card Value</span>
        <strong style="font-size: 16px;" id="gcConfirmUsd">$0</strong>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #cbd5e1; padding-top: 12px; margin-top: 12px;">
        <span class="muted" style="font-size: 14px;">Total Deduction</span>
        <strong style="font-size: 20px; color: var(--brand);" id="gcConfirmPrice">₦0.00</strong>
      </div>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="font-size: 13px; font-weight: 600; margin-bottom: 8px; display: block;">Recipient Email</label>
      <input type="email" id="gcEmail" placeholder="Enter email for delivery" style="width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; background: #f8fafc;">
    </div>

    <div id="gcError" class="hidden text-red-500" style="font-size: 14px; margin-bottom: 12px; text-align: center;"></div>
    
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelGcBtn">Cancel</button>
      <button class="btn-pay" id="confirmGcBtn">Pay Now</button>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script>
  let selectedGcData = null;

  // 🟢 HELPER: Formats price smartly. 
  // 5 -> "$5", 5.5 -> "$5.50"
  function formatPrice(amount) {
    const num = Number(amount);
    if (isNaN(num)) return "0";
    return num % 1 === 0 ? num.toString() : num.toFixed(2);
  }

  document.addEventListener("DOMContentLoaded", async () => {
    if (window.lucide) lucide.createIcons();
    const urlParams = new URLSearchParams(window.location.search);
    const operatorId = urlParams.get('operator');
    const grid = document.getElementById("productGrid");

    if (!operatorId) {
      grid.innerHTML = `<p style="color:red;">No brand selected. Please go back.</p>`;
      return;
    }

    try {
      const data = await apiFetch(`/giftcard/products/${operatorId}`);
      
      if (!data.products || data.products.length === 0) {
        throw new Error("Gift cards are currently out of stock for this brand.");
      }

      grid.innerHTML = data.products.map(p => {
        // Fallback: If Billpoint API didn't return USD, calculate from Naira
        const usdValue = p.usd ? p.usd : (p.ngn / 1500); 
        
        return `
        <div class="giftcard-item">
          <div>
            <div class="gc-title">${p.name}</div>
            <div class="gc-price-usd">$${formatPrice(usdValue)}</div>
            <div class="gc-price-ngn">≈ ₦${p.ngn.toLocaleString()}</div>
          </div>
          <button class="gc-btn" 
            onclick="openBuyModal('${p.id}', '${operatorId}', ${p.ngn}, ${usdValue}, '${p.name}')">
            Buy Card
          </button>
        </div>
      `}).join('');
    } catch (e) { 
      grid.innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
          <p style="color: #ef4444; font-weight: 600; margin-bottom: 16px;">${e.message}</p>
          <button class="blue-button" onclick="window.history.back()" style="margin: 0 auto;">Go Back</button>
        </div>
      `; 
    }
  });

  window.openBuyModal = (productId, operatorId, priceNgn, priceUsd, name) => {
    selectedGcData = { productId, operatorId, priceNgn, priceUsd, name };
    document.getElementById("gcConfirmName").textContent = name;
    document.getElementById("gcConfirmUsd").textContent = `$${formatPrice(priceUsd)}`;
    document.getElementById("gcConfirmPrice").textContent = `₦${priceNgn.toLocaleString()}`;
    document.getElementById("gcEmail").value = "";
    document.getElementById("gcError").classList.add("hidden");
    document.getElementById("buyGcModal").classList.remove("hidden");
  };

  document.getElementById("cancelGcBtn").addEventListener("click", () => {
    document.getElementById("buyGcModal").classList.add("hidden");
    selectedGcData = null;
  });

  document.getElementById("confirmGcBtn").addEventListener("click", async (e) => {
    const btn = e.target;
    const email = document.getElementById("gcEmail").value.trim();
    const errorEl = document.getElementById("gcError");

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errorEl.textContent = "Please enter a valid email address.";
      errorEl.classList.remove("hidden");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Processing...";
    errorEl.classList.add("hidden");

    try {
      await apiFetch("/giftcard/buy", {
        method: "POST",
        body: JSON.stringify({ 
          productId: selectedGcData.productId, 
          operatorId: selectedGcData.operatorId, 
          // 🟢 FIXED: Sending USD to the backend, because backend multiplies by 1500
          amount: selectedGcData.priceUsd, 
          email 
        })
      });
      
      document.getElementById("buyGcModal").classList.add("hidden");
      alert("Giftcard purchased successfully! Check History for your redeem code.");
      window.location.href = "history.html";
    } catch (err) {
      errorEl.textContent = err.message || "Failed to purchase gift card.";
      errorEl.classList.remove("hidden");
    } finally {
      btn.disabled = false;
      btn.textContent = "Pay Now";
    }
  });
</script>
</body>
</html>
