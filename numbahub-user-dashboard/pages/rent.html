<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Activation — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container" style="max-width: 900px;">
      
      <!-- Header -->
      <div class="page-heading" style="display: flex; align-items: center; gap: 16px; margin-bottom: 32px;">
        <button onclick="window.location.href='../index.html'" class="icon-button" style="width: 44px; height: 44px; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid var(--border);">
          <i data-lucide="arrow-left" style="width: 20px;"></i>
        </button>
        <div>
          <h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">SMS Activation</h2>
          <p style="margin: 4px 0 0; color: var(--muted); font-size: 14px;">Receive SMS verification codes for WhatsApp, Telegram, and more.</p>
        </div>
      </div>

      <!-- Premium Country Filter -->
      <div class="premium-card" style="padding: 24px; margin-bottom: 32px; z-index: 10;">
        <label style="font-size: 14px; font-weight: 700; margin-bottom: 16px; display: block; color: var(--text);">1. Select Country</label>
        <div id="countryTabs" class="country-tabs-wrap">
          <!-- Tabs injected here -->
          <div style="padding: 12px; width: 100%; text-align: center; color: var(--muted);">Loading countries...</div>
        </div>
      </div>

      <!-- Service Cards Grid -->
      <label style="font-size: 14px; font-weight: 700; margin-bottom: 16px; display: block; color: var(--text);">2. Select Service</label>
      <div class="grid-3" id="rentalGrid">
        <!-- Initial Skeleton Loader -->
        <div class="rent-card" style="opacity: 0.6;">
          <div style="width: 48px; height: 48px; border-radius: 14px; background: #e2e8f0; margin-bottom: 16px;"></div>
          <div style="height: 20px; width: 60%; background: #e2e8f0; border-radius: 4px; margin-bottom: 12px;"></div>
          <div style="height: 14px; width: 40%; background: #e2e8f0; border-radius: 4px; margin-bottom: 24px;"></div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="height: 24px; width: 30%; background: #e2e8f0; border-radius: 4px;"></div>
            <div style="height: 36px; width: 40%; background: #e2e8f0; border-radius: 8px;"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- PREMIUM SUCCESS MODAL -->
<div id="successModal" class="modal-overlay hidden">
  <div class="modal-content" style="max-width: 400px;">
    <div style="width: 72px; height: 72px; background: #dcfce7; color: #16a34a; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px; box-shadow: 0 10px 20px -5px rgba(22, 163, 74, 0.2);">
      <i data-lucide="check" style="width: 32px; height: 32px;"></i>
    </div>
    <h3 style="margin-bottom: 8px; font-size: 22px; font-weight: 800; color: var(--text);">Number Activated!</h3>
    <p style="font-size: 14px; color: var(--muted); margin-bottom: 24px;">Enter this number in the app to receive your code.</p>
    
    <div style="background: #f8fafc; padding: 24px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 24px; position: relative;">
      <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #22c55e, #16a34a); border-radius: 20px 20px 0 0;"></div>
      <div style="font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Phone Number</div>
      <div style="font-size: 28px; font-weight: 800; color: var(--text); letter-spacing: 1.5px; font-family: monospace;" id="successPhone">+1 234 567 8900</div>
      
      <div style="font-size: 12px; color: var(--muted); margin-top: 20px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Valid Until</div>
      <div style="font-size: 15px; font-weight: 700; color: var(--brand-dark);" id="successExpiry">-</div>
    </div>
    
    <button class="btn-pay" style="width: 100%; padding: 16px; font-size: 16px;" onclick="window.location.href='receive-sms.html'">View Active Number</button>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script>
  const flagMap = {
    "usa": "us",
    "england": "gb",
    "nigeria": "ng",
    "canada": "ca",
    "germany": "de"
  };
  const EXCHANGE_RATE = 1500; // For display purposes

  document.addEventListener("DOMContentLoaded", async () => {
    if (window.lucide) lucide.createIcons();
    const countryTabs = document.getElementById("countryTabs");
    const rentalGrid = document.getElementById("rentalGrid");
    const successModal = document.getElementById("successModal");

    // 1. Fetch Countries
    try {
      const data = await apiFetch("/rent/countries");
      const countries = data.countries || [];
      
      if (countries.length === 0) {
        countryTabs.innerHTML = `<p class="muted" style="padding: 12px;">No countries available.</p>`;
        return;
      }

      countryTabs.innerHTML = countries.map(c => {
        const isoCode = flagMap[c.code] || c.code.substring(0,2);
        return `
          <button class="country-tab" data-code="${c.code}" onclick="loadPrices('${c.code}', this)">
            <img src="https://flagcdn.com/w40/${isoCode}.png" alt="${c.name}">
            ${c.name}
          </button>
        `;
      }).join('');

      // Auto-click the first country
      const firstTab = countryTabs.querySelector(".country-tab");
      if (firstTab) firstTab.click();

    } catch (error) {
      countryTabs.innerHTML = `<p class="text-red-500" style="padding: 12px;">Failed to load countries: ${error.message}</p>`;
    }

    // 2. Load Prices for Selected Country
    window.loadPrices = async (countryCode, btnElement) => {
      // Update active tab
      document.querySelectorAll(".country-tab").forEach(t => t.classList.remove("active"));
      btnElement.classList.add("active");

      // Show Skeleton Loader
      rentalGrid.innerHTML = Array(3).fill(`
        <div class="rent-card" style="opacity: 0.6;">
          <div style="width: 48px; height: 48px; border-radius: 14px; background: #e2e8f0; margin-bottom: 16px;"></div>
          <div style="height: 20px; width: 60%; background: #e2e8f0; border-radius: 4px; margin-bottom: 12px;"></div>
          <div style="height: 14px; width: 40%; background: #e2e8f0; border-radius: 4px; margin-bottom: 24px;"></div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="height: 24px; width: 30%; background: #e2e8f0; border-radius: 4px;"></div>
            <div style="height: 36px; width: 40%; background: #e2e8f0; border-radius: 8px;"></div>
          </div>
        </div>
      `).join('');

      try {
        const data = await apiFetch(`/rent/prices?country=${countryCode}`);
        const prices = data.prices || [];
        
        if (prices.length === 0) {
          rentalGrid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; background: rgba(255,255,255,0.5); border-radius: 20px; border: 1px dashed #cbd5e1;">
              <p class="muted" style="font-size: 15px; font-weight: 600;">No activations available for this country right now.</p>
            </div>
          `;
          return;
        }

        rentalGrid.innerHTML = prices.map(plan => {
          const priceNgn = plan.priceInUsd * EXCHANGE_RATE;
          return `
            <div class="rent-card">
              <div>
                <div class="rent-icon-wrap">
                  <i data-lucide="message-square" style="width: 24px;"></i>
                </div>
                <h3 class="rent-title">${plan.serviceName}</h3>
                <div class="rent-desc">1-time activation code</div>
              </div>
              
              <div class="rent-price-row">
                <div>
                  <div class="rent-price">$${plan.priceInUsd.toFixed(2)}</div>
                  <div class="rent-price-ngn">≈ ₦${priceNgn.toLocaleString()}</div>
                </div>
                <button class="rent-btn" onclick="rentNumber('${countryCode}', '${plan.service}', ${plan.priceInUsd}, this)">
                  Activate
                </button>
              </div>
            </div>
          `;
        }).join('');
        
        if (window.lucide) lucide.createIcons();

      } catch (error) {
        rentalGrid.innerHTML = `<p class="text-red-500" style="grid-column: 1/-1; text-align: center;">Failed to load: ${error.message}</p>`;
      }
    };

    // 3. Purchase Activation
    window.rentNumber = async (countryCode, serviceCode, priceUsd, btnElement) => {
      const originalText = btnElement.textContent;
      btnElement.disabled = true;
      btnElement.innerHTML = `<i data-lucide="loader" style="width: 16px; animation: spin 1s linear infinite;"></i>`;
      if (window.lucide) lucide.createIcons();

      try {
        const response = await apiFetch("/rent/rent", {
          method: "POST",
          body: JSON.stringify({ countryCode, serviceCode, priceUsd })
        });

        document.getElementById("successPhone").textContent = response.rental.phoneNumber;
        
        const expiryTime = new Date(response.rental.expiresAt).toLocaleTimeString('en-GB', {
          hour: '2-digit', minute: '2-digit'
        });
        document.getElementById("successExpiry").textContent = `Valid until ${expiryTime} today`;
        
        successModal.classList.remove("hidden");

        // Update cached wallet balance
        const cachedUser = getUser();
        if (cachedUser) {
          cachedUser.walletBalance = response.walletBalance;
          setUser(cachedUser);
        }

      } catch (err) {
        alert(err.message || "Failed to purchase activation.");
        btnElement.disabled = false;
        btnElement.textContent = originalText;
      }
    };
  });
</script>
</body>
</html>
