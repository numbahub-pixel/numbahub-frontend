  <h2>Rent Numbers</h2>
  <p>Rent a dedicated virtual number for longer-term use.</p>

      <div class="field">
        <label>Country</label>
        <select class="select">
          <option>Choose a country</option>
          <option>Nigeria</option>
          <option>United States</option>
          <option>United Kingdom</option>
        </select>
      </div>
  </div>
  <div class="form-grid">
      <div class="field">
        <label>Categoty</label>
        <select class="select">
          <option>All</option>
          <option>Google</option>
          <option>Telegram</option>
          <option>WhatsApp</option>
        </select>
      </div>
  </div>

  <div class="form-grid">
    <div class="field">
      <label>Select Duration</label>
      <select class="select">
        <option>Select duration</option>
        <option>1 day</option>
        <option>7 days</option>
        <option>30 days</option>
      </select>
    </div>
  </div>
  <div class="form-grid">
    <div class="field">
      <label>Cost</label>
      <input class="input" placeholder="">
    </div>
  </div>

  <button class="blue-button" style="margin-top:20px;">Search numbers</button>
  <div class="empty">
    <div>
      <div class="empty-icon">
        <i data-lucide="phone"></i>
      </div>
      <strong>No rental number</strong>
      <p>Search for a country and duration to see available numbers.</p>
    </div>
  </div>
