<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Activation — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Premium Custom Styles for this page */
    .sms-hero {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-radius: 24px; padding: 40px 32px; color: #fff;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3);
      margin-bottom: 32px; position: relative; overflow: hidden;
    }
    .sms-hero::before {
      content: ''; position: absolute; top: -50%; right: -20%; width: 60%; height: 200%;
      background: radial-gradient(circle, rgba(67,137,238,0.15) 0%, transparent 70%);
    }
    
    /* Country Tabs Scrollable */
    .country-tabs-wrap {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;
      scrollbar-width: none; /* Firefox */
    }
    .country-tabs-wrap::-webkit-scrollbar { display: none; } /* Chrome */
    .country-tab {
      padding: 12px 20px; border: 1px solid var(--border); border-radius: 14px;
      background: #fff; font-weight: 700; color: var(--muted);
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .country-tab:hover { border-color: var(--brand); color: var(--text); }
    .country-tab.active {
      background: #eff6ff; color: var(--brand-dark); border-color: var(--brand);
      box-shadow: 0 4px 12px rgba(67,137,238,0.15);
    }
    .country-tab img { width: 22px; height: 16px; border-radius: 3px; object-fit: cover; }

    /* Search Bar */
    .search-wrapper {
      position: relative; width: 100%; margin-bottom: 32px;
    }
    .search-wrapper i {
      position: absolute; left: 20px; top: 18px; color: var(--muted); width: 20px;
    }
    .search-input {
      width: 100%; padding: 18px 20px 18px 54px; border: 1px solid var(--border);
      border-radius: 16px; font-size: 16px; font-weight: 500; background: #fff;
      outline: none; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }
    .search-input:focus {
      border-color: var(--brand); box-shadow: 0 0 0 4px rgba(67,137,238,0.1);
    }

    /* Premium Service Cards */
    .service-card {
      background: #fff; border: 1px solid var(--border); border-radius: 20px;
      padding: 24px; display: flex; flex-direction: column; justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
    }
    .service-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px -10px rgba(67,137,238,0.15);
      border-color: rgba(67,137,238,0.3);
    }
    .service-icon-wrap {
      width: 48px; height: 48px; border-radius: 14px; background: #f8fafc;
      color: var(--brand); display: grid; place-items: center; margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .service-name {
      font-size: 17px; font-weight: 800; color: var(--text); margin: 0 0 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .service-desc { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 20px; }
    
    .service-price-row {
      display: flex; justify-content: space-between; align-items: flex-end;
      border-top: 1px dashed var(--border); padding-top: 16px; margin-top: auto;
    }
    .service-price-ngn { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1; }
    .service-price-usd { font-size: 13px; font-weight: 600; color: var(--brand-dark); margin-top: 4px; }
    
    .btn-activate {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: white; border: none; padding: 10px 18px; border-radius: 10px;
      font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s;
      box-shadow: 0 4px 10px -2px rgba(67,137,238,0.4);
    }
    .btn-activate:hover { transform: translateY(-2px); box-shadow: 0 8px 15px -3px rgba(67,137,238,0.5); }

    /* Responsive Grid */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
  </style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container" style="max-width: 1000px;">
      
      <!-- Country Filter -->
      <div style="margin-bottom: 32px;">
        <label style="font-size: 14px; font-weight: 800; margin-bottom: 12px; display: block; color: var(--text); text-transform: uppercase; letter-spacing: 0.5px;">1. Select Country</label>
        <div id="countryTabs" class="country-tabs-wrap">
          <div style="padding: 12px; width: 100%; text-align: center; color: var(--muted);">Loading countries...</div>
        </div>
      </div>

      <!-- Search Bar -->
      <div style="margin-bottom: 32px;">
        <label style="font-size: 14px; font-weight: 800; margin-bottom: 12px; display: block; color: var(--text); text-transform: uppercase; letter-spacing: 0.5px;">2. Search Service</label>
        <div class="search-wrapper">
          <i data-lucide="search"></i>
          <input type="text" id="serviceSearch" class="search-input" placeholder="Search for WhatsApp, Telegram, Tinder, etc." onkeyup="filterServices()">
        </div>
      </div>

      <!-- Services Grid -->
      <div class="services-grid" id="rentalGrid">
        <!-- Skeleton Loader -->
        <div class="service-card" style="opacity: 0.6;">
          <div style="width: 48px; height: 48px; border-radius: 14px; background: #e2e8f0; margin-bottom: 16px;"></div>
          <div style="height: 20px; width: 60%; background: #e2e8f0; border-radius: 4px; margin-bottom: 12px;"></div>
          <div style="height: 14px; width: 40%; background: #e2e8f0; border-radius: 4px; margin-bottom: 24px;"></div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="height: 24px; width: 30%; background: #e2e8f0; border-radius: 4px;"></div>
            <div style="height: 36px; width: 40%; background: #e2e8f0; border-radius: 8px;"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- PREMIUM SUCCESS MODAL -->
<div id="successModal" class="modal-overlay hidden">
  <div class="modal-content" style="max-width: 400px;">
    <div style="width: 72px; height: 72px; background: #dcfce7; color: #16a34a; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px; box-shadow: 0 10px 20px -5px rgba(22, 163, 74, 0.2);">
      <i data-lucide="check" style="width: 32px; height: 32px;"></i>
    </div>
    <h3 style="margin-bottom: 8px; font-size: 22px; font-weight: 800; color: var(--text); text-align: center;">Number Activated!</h3>
    <p style="font-size: 14px; color: var(--muted); margin-bottom: 24px; text-align: center;">Enter this number in the app to receive your code.</p>
    
    <div style="background: #f8fafc; padding: 24px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 24px; position: relative;">
      <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #22c55e, #16a34a); border-radius: 20px 20px 0 0;"></div>
      <div style="font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; text-align: center;">Phone Number</div>
      <div style="font-size: 28px; font-weight: 800; color: var(--text); letter-spacing: 1.5px; font-family: monospace; text-align: center;" id="successPhone">+1 234 567 8900</div>
      
      <div style="font-size: 12px; color: var(--muted); margin-top: 20px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; text-align: center;">Valid Until</div>
      <div style="font-size: 15px; font-weight: 700; color: var(--brand-dark); text-align: center;" id="successExpiry">-</div>
    </div>
    
    <button class="btn-pay" style="width: 100%; padding: 16px; font-size: 16px;" onclick="window.location.href='receive-sms.html'">View Active Number</button>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script>
  const flagMap = { "usa": "us", "england": "gb", "nigeria": "ng", "canada": "ca", "germany": "de" };
  const popularApps = ["whatsapp", "telegram", "google", "instagram", "twitter", "discord", "tinder", "facebook", "tiktok"];

  let allPrices = []; 
  let activeCountryCode = ""; // 👈 GLOBAL VARIABLE TO TRACK SELECTED COUNTRY

  document.addEventListener("DOMContentLoaded", async () => {
    if (window.lucide) lucide.createIcons();
    const countryTabs = document.getElementById("countryTabs");
    const rentalGrid = document.getElementById("rentalGrid");
    const successModal = document.getElementById("successModal");

    // 1. Fetch Countries
    try {
      const data = await apiFetch("/rent/countries");
      const countries = data.countries || [];
      
      if (countries.length === 0) {
        countryTabs.innerHTML = `<p class="muted" style="padding: 12px;">No countries available.</p>`;
        return;
      }

      countryTabs.innerHTML = countries.map(c => {
        const isoCode = flagMap[c.code] || c.code.substring(0,2);
        return `
          <button class="country-tab" data-code="${c.code}" onclick="loadPrices('${c.code}', this)">
            <img src="https://flagcdn.com/w40/${isoCode}.png" alt="${c.name}">
            ${c.name}
          </button>
        `;
      }).join('');

      const firstTab = countryTabs.querySelector(".country-tab");
      if (firstTab) firstTab.click();

    } catch (error) {
      countryTabs.innerHTML = `<p class="text-red-500" style="padding: 12px;">Failed to load countries: ${error.message}</p>`;
    }

    // 2. Load Prices
    window.loadPrices = async (countryCode, btnElement) => {
      activeCountryCode = countryCode; // 👈 SAVE THE ACTIVE COUNTRY

      document.querySelectorAll(".country-tab").forEach(t => t.classList.remove("active"));
      btnElement.classList.add("active");

      document.getElementById("serviceSearch").value = "";

      rentalGrid.innerHTML = Array(6).fill(`
        <div class="service-card" style="opacity: 0.6;">
          <div style="width: 48px; height: 48px; border-radius: 14px; background: #e2e8f0; margin-bottom: 16px;"></div>
          <div style="height: 20px; width: 60%; background: #e2e8f0; border-radius: 4px; margin-bottom: 12px;"></div>
          <div style="height: 14px; width: 40%; background: #e2e8f0; border-radius: 4px; margin-bottom: 24px;"></div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="height: 24px; width: 30%; background: #e2e8f0; border-radius: 4px;"></div>
            <div style="height: 36px; width: 40%; background: #e2e8f0; border-radius: 8px;"></div>
          </div>
        </div>
      `).join('');

      try {
        const data = await apiFetch(`/rent/prices?country=${countryCode}`);
        allPrices = data.prices || [];
        
        if (allPrices.length === 0) {
          rentalGrid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; background: #fff; border-radius: 20px; border: 1px dashed #cbd5e1;">
              <i data-lucide="inbox" style="width: 48px; height: 48px; color: #cbd5e1; margin: 0 auto 16px;"></i>
              <p class="muted" style="font-size: 15px; font-weight: 600;">No activations available for this country right now.</p>
            </div>
          `;
          if (window.lucide) lucide.createIcons();
          return;
        }

        allPrices.sort((a, b) => {
          const aIsPop = popularApps.includes(a.service.toLowerCase());
          const bIsPop = popularApps.includes(b.service.toLowerCase());
          if (aIsPop && !bIsPop) return -1;
          if (!aIsPop && bIsPop) return 1;
          return a.serviceName.localeCompare(b.serviceName);
        });

        renderServices(allPrices);

      } catch (error) {
        rentalGrid.innerHTML = `<p class="text-red-500" style="grid-column: 1/-1; text-align: center;">Failed to load: ${error.message}</p>`;
      }
    };

    // 3. Render Services
    function renderServices(services) {
      if (services.length === 0) {
        rentalGrid.innerHTML = `<p class="muted" style="grid-column: 1/-1; text-align: center; padding: 40px;">No services found matching your search.</p>`;
        return;
      }

      rentalGrid.innerHTML = services.map(plan => {
        const priceNgn = plan.priceInNgn || Math.round(plan.priceInUsd * 1500);
        
        return `
          <div class="service-card">
            <div>
              <div class="service-icon-wrap">
                <i data-lucide="message-circle" style="width: 24px;"></i>
              </div>
              <h3 class="service-name" title="${plan.serviceName}">${plan.serviceName}</h3>
              <div class="service-desc">1-time activation</div>
            </div>
            
            <div class="service-price-row">
              <div>
                <div class="service-price-ngn">₦${priceNgn.toLocaleString()}</div>
                <div class="service-price-usd">≈ $${plan.priceInUsd ? plan.priceInUsd.toFixed(2) : (priceNgn/1500).toFixed(2)}</div>
              </div>
              <!-- 👈 FIXED: Only pass service code and button element -->
              <button class="btn-activate" onclick="rentNumber('${plan.service}', this)">
                Activate
              </button>
            </div>
          </div>
        `;
      }).join('');
      
      if (window.lucide) lucide.createIcons();
    }

    // 4. Search Filter
    window.filterServices = () => {
      const query = document.getElementById("serviceSearch").value.toLowerCase();
      const filtered = allPrices.filter(p => p.serviceName.toLowerCase().includes(query));
      renderServices(filtered);
    };

    // 5. Purchase Activation
    window.rentNumber = async (serviceCode, btnElement) => {
      const originalText = btnElement.textContent;
      btnElement.disabled = true;
      btnElement.innerHTML = `<i data-lucide="loader" style="width: 16px; animation: spin 1s linear infinite;"></i>`;
      if (window.lucide) lucide.createIcons();

      try {
        const response = await apiFetch("/rent/rent", {
          method: "POST",
          // 👈 FIXED: Using the global activeCountryCode
          body: JSON.stringify({ countryCode: activeCountryCode, serviceCode }) 
        });

        document.getElementById("successPhone").textContent = response.rental.phoneNumber;
        
        const expiryTime = new Date(response.rental.expiresAt).toLocaleTimeString('en-GB', {
          hour: '2-digit', minute: '2-digit'
        });
        document.getElementById("successExpiry").textContent = `Valid until ${expiryTime} today`;
        
        successModal.classList.remove("hidden");

        const cachedUser = getUser();
        if (cachedUser) {
          cachedUser.walletBalance = response.walletBalance;
          setUser(cachedUser);
        }

      } catch (err) {
        alert(err.message || "Failed to purchase activation.");
        btnElement.disabled = false;
        btnElement.textContent = originalText;
      }
    };
  });
</script>
</body>
</html>
