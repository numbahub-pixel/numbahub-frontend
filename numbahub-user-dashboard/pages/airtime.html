<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airtime & Data — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .operator-tabs { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
    .operator-tab {
      padding: 12px 20px; border: 1px solid var(--border); border-radius: 12px; background: #fff;
      font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .operator-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    
    .amount-pills { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .amount-pill {
      padding: 10px 20px; border: 1px solid var(--border); border-radius: 20px; background: #fff;
      font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .amount-pill:hover, .amount-pill.active { border-color: var(--brand); background: #eff6ff; color: var(--brand); }
  </style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container" style="max-width: 700px;">
      <div class="page-heading">
        <h2>Airtime & Data</h2>
        <p>Top up any mobile number, anywhere in the world.</p>
      </div>

      <div class="premium-card" style="padding: 32px;">
        
        <!-- Network Selection -->
        <div class="premium-form-group">
          <label for="networkSelect">Mobile Network</label>
          <select class="premium-select" id="networkSelect">
            <option value="">Select a network</option>
            <option value="MTN">MTN</option>
            <option value="AIRTEL">Airtel</option>
            <option value="GLO">Glo</option>
            <option value="9MOBILE">9mobile</option>
          </select>
        </div>

        <!-- Phone & Amount -->
        <div class="premium-form-group">
          <label>Recipient Phone Number</label>
          <div class="input-wrapper">
            <i data-lucide="phone" class="input-icon"></i>
            <input class="premium-input" id="phoneNumber" type="tel" placeholder="e.g. 08012345678">
          </div>
        </div>

        <div class="premium-form-group">
          <label for="amountInput">Airtime Amount (NGN)</label>
          <div class="input-wrapper">
            <i data-lucide="banknote" class="input-icon"></i>
            <input class="premium-input" id="amountInput" type="number" min="50" max="50000" step="1" placeholder="Enter amount from ₦50 to ₦50,000" oninput="updateAmount()">
          </div>
          <div class="amount-pills">
            <button class="amount-pill" type="button" onclick="setAmount(100)">₦100</button>
            <button class="amount-pill" type="button" onclick="setAmount(500)">₦500</button>
            <button class="amount-pill" type="button" onclick="setAmount(1000)">₦1,000</button>
            <button class="amount-pill" type="button" onclick="setAmount(2000)">₦2,000</button>
          </div>
          <p id="markupNote" class="muted" style="font-size: 12px; margin-top: 8px;"></p>
        </div>

        <!-- Live Conversion -->
        <div id="priceBox" class="price-receipt hidden" style="margin-top: 24px;">
          <div>
            <div class="price-receipt-label">Total Deduction</div>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">From your NGN wallet</div>
          </div>
          <div id="totalCostNgn" class="price-receipt-value">₦0.00</div>
        </div>

        <div id="formError" class="hidden text-red-500" style="font-size: 14px; margin-top: 16px; text-align: center;"></div>

        <button class="btn-premium" id="buyBtn" style="margin-top: 24px;">
          Purchase Airtime <i data-lucide="arrow-right"></i>
        </button>
      </div>
    </main>
  </div>
</div>

<!-- CONFIRMATION MODAL -->
<div id="confirmModal" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>Confirm Top-Up</h3>
    <div style="background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; text-align: left;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <span class="muted">Recipient</span>
        <strong id="modalPhone">-</strong>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span class="muted">Total Charge</span>
        <strong style="color: var(--brand);" id="modalPrice">₦0.00</strong>
      </div>
    </div>
    <div id="modalError" class="hidden text-red-500" style="font-size: 14px; margin-bottom: 12px;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="document.getElementById('confirmModal').classList.add('hidden')">Cancel</button>
      <button class="btn-pay" id="confirmBuyBtn">Confirm & Pay</button>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script>
  let airtimeMarkup = null;

  document.addEventListener("DOMContentLoaded", async () => {
    if (window.lucide) lucide.createIcons();
    const buyButton = document.getElementById("buyBtn");
    buyButton.disabled = true;
    try {
      const pricing = await apiFetch("/airtime/pricing", { auth: false });
      airtimeMarkup = pricing.markupPercent;
      document.getElementById("markupNote").textContent =
        `A ${airtimeMarkup}% service markup is included in the total charge.`;
      buyButton.disabled = false;
    } catch (error) {
      const errorEl = document.getElementById("formError");
      errorEl.textContent = `Could not load current airtime pricing: ${error.message}`;
      errorEl.classList.remove("hidden");
    }
  });

  window.setAmount = (amount) => {
    document.getElementById("amountInput").value = amount;
    updateAmount();
    document.querySelectorAll(".amount-pill").forEach(pill => {
      pill.classList.toggle("active", Number(pill.textContent.replace(/[^\d]/g, "")) === amount);
    });
  };

  window.updateAmount = () => {
    const amountNgn = Number(document.getElementById("amountInput").value);
    const priceBox = document.getElementById("priceBox");
    const totalCostNgn = document.getElementById("totalCostNgn");

    if (Number.isFinite(amountNgn) && amountNgn > 0 && airtimeMarkup !== null) {
      const chargedAmount = Math.round(amountNgn * (1 + airtimeMarkup / 100));
      totalCostNgn.textContent = `₦${chargedAmount.toLocaleString('en-NG')}`;
      priceBox.classList.remove("hidden");
    } else {
      priceBox.classList.add("hidden");
    }
  };

  document.getElementById("buyBtn").addEventListener("click", () => {
    const phone = document.getElementById("phoneNumber").value.trim();
    const amount = Number(document.getElementById("amountInput").value);
    const network = document.getElementById("networkSelect").value;
    const errorEl = document.getElementById("formError");

    if (!network || !phone || !Number.isFinite(amount) || amount < 50 || amount > 50000) {
      errorEl.textContent = "Select a network, enter a valid phone number, and choose an amount from ₦50 to ₦50,000.";
      errorEl.classList.remove("hidden");
      return;
    }

    errorEl.classList.add("hidden");
    document.getElementById("modalPhone").textContent = phone;
    document.getElementById("modalPrice").textContent = document.getElementById("totalCostNgn").textContent;
    document.getElementById("modalError").classList.add("hidden");
    document.getElementById("confirmModal").classList.remove("hidden");
  });

  document.getElementById("confirmBuyBtn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const originalText = btn.textContent;
    const phone = document.getElementById("phoneNumber").value.trim();
    const amount = Number(document.getElementById("amountInput").value);
    const network = document.getElementById("networkSelect").value;
    const modalError = document.getElementById("modalError");

    btn.disabled = true;
    btn.textContent = "Processing...";
    modalError.classList.add("hidden");

    try {
      await apiFetch("/airtime/buy", {
        method: "POST",
        body: JSON.stringify({
          network,
          phone,
          amount,
        }),
      });

      document.getElementById("confirmModal").classList.add("hidden");
      alert("Airtime purchased successfully! Check History.");
      window.location.href = "history.html";

    } catch (err) {
      modalError.textContent = err.message || "Failed to purchase airtime.";
      modalError.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });
</script>
</body>
</html>
