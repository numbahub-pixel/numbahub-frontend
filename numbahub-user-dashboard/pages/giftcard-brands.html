<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Brand — NumbaHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container">
      <div class="page-heading" style="display: flex; align-items: center; gap: 12px;">
        <button onclick="window.location.href='giftcards.html'" class="icon-button" style="width: 40px; height: 40px;"><i data-lucide="arrow-left" style="width: 18px;"></i></button>
        <div>
          <h2 style="margin: 0; font-size: 24px; font-weight: 800;">Select Brand</h2>
          <p style="margin: 4px 0 0;">Choose from popular global brands.</p>
        </div>
      </div>

      <div class="grid-3" id="brandGrid">
        <p>Loading brands...</p>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    if (window.lucide) lucide.createIcons();
    const grid = document.getElementById("brandGrid");
    const urlParams = new URLSearchParams(window.location.search);
    const country = urlParams.get('country');

    if (!country) {
      grid.innerHTML = `<p style="color:red; text-align:center; grid-column:1/-1;">No country selected.</p>`;
      return;
    }

    try {
      const data = await apiFetch(`/giftcard/brands/${country}`);
      const brands = data.brands || [];
      
      if (brands.length === 0) {
        grid.innerHTML = `<p class="muted" style="grid-column: 1/-1; text-align: center;">No brands available for this country.</p>`;
        return;
      }

      grid.innerHTML = brands.map(b => `
        <div class="brand-card" onclick="window.location.href='giftcard-products.html?operator=${b.id}'">
          <div class="brand-img-wrapper">
            <img src="${b.image}" alt="${b.name}">
          </div>
          <h3 style="font-size: 15px; margin: 0; font-weight: 700; color: var(--text);">${b.name}</h3>
        </div>
      `).join('');
    } catch (error) {
      grid.innerHTML = `<p style="color:red; grid-column: 1/-1; text-align:center;">Failed to load brands: ${error.message}</p>`;
    }
  });
</script>
</body>
</html>
