<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — NumbaHub</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <div class="overlay"></div>
  
  <div class="main">
    <main class="container">
      
      <section class="balance-card">
        <div>
          <div class="balance-label">Available balance</div>
          <div class="balance" id="walletBalance">$0.00 <span style="font-size:16px;color:#dbeafe;"><i data-lucide="eye"></i></span></div>
        </div>
        <!-- 👈 REDIRECTS TO THE FULL PAGE INSTEAD OF MODAL -->
        <a href="pages/fund-wallet.html" class="primary-button" style="text-decoration: none;">
          <i data-lucide="plus"></i> Fund wallet
        </a>
      </section>

      <div class="quickaccess">
        <p>Quick access</p>
      </div>

      <section class="service-grid">
        <a class="service-item" href="pages/Referral.html">
          <span class="service-icon icon-violet"><i data-lucide="user-group"></i></span>
          <span style="font-weight:500;">Referral</span>
        </a>
        <a class="service-item" href="pages/airtime.html">
          <span class="service-icon icon-blue"><i data-lucide="phone"></i></span>
          <span style="font-weight:500;">Airtime</span>
        </a>
        <a class="service-item" href="pages/esim.html">
          <span class="service-icon icon-orange"><i data-lucide="card-sim"></i></span>
          <span style="font-weight:500;">eSIM</span>
        </a>
        <a class="service-item" href="pages/giftcards.html">
          <span class="service-icon icon-green"><i data-lucide="gift"></i></span>
          <span style="font-weight:500;">Giftcards</span>
        </a>
      </section>

      <section class="two-column">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Rent numbers <span class="count">0</span></h2>
            <a class="view-link" href="pages/rent.html">View all</a>
          </div>
          <div class="empty">
            <div><div class="empty-icon"><i data-lucide="search"></i></div><strong>No rental number</strong><p>Your active rental numbers will appear here.</p></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">eSIMs <span class="count">0</span></h2>
            <a class="view-link" href="pages/esim.html">View all</a>
          </div>
          <div class="empty">
            <div><div class="empty-icon"><i data-lucide="card-sim"></i></div><strong>No eSIM</strong><p>Your active eSIM plans will appear here.</p></div>
          </div>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    lucide.createIcons();
  });
</script>
</body>
</html>
